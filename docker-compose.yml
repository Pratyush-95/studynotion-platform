

services:
  backend:
    build:
      context: ./Server
    container_name: studynotion-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./Server/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./Server:/app
      - /app/node_modules

  frontend:
    build:
      context: ./Client
    container_name: studynotion-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./Client/.env
    depends_on:
      - backend
    volumes:
      - ./Client:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    container_name: studynotion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data: